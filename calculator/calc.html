<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Number List</title>

    <link rel="stylesheet" href="calc.css">
    <script src="calc.js"></script>
</head>
<body>
    <h1>Number list</h1>
    <div class="myflexboxRow">
        <div class="myflexboxColumn">
            <h2>Set the number range</h2>
            <form name="myForm">
             minimum: <input type="number" name="minimum" required><br />
             maximum: <input type="number" name="maximum" required><br />
                <input type="button" value="Set range" onclick="RangeSetter()"><br /><br />
                Number to add: <input type="number" name="newNumber" required><br /><br />
                <input type="button" value="Add to list" onclick="validateANDadd()">
            </form>
        </div>
        <div class="myflexboxColumn">
            <h2>Numbers</h2>
            <table id="myList">
            </table>
            <br /> <br />
            <input type="button" value="Clear the list" onclick="clearList()">
            <p id="statistics">Mean: <br />Median: <br />Mode: </p>
        </div>
    </div>    
</body>
</html>
