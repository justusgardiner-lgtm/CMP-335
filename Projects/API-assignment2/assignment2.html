<!doctype html>
<html lang="en" data-bs-theme="auto">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="A simple high card betting game" />
  <title>High Card Betting Game</title>
  <script src="assignment2.js"></script>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="assignment2.css" rel="stylesheet">
</head>

<body>
  <div class="dropdown position-fixed bottom-0 end-0 mb-3 me-3 bd-mode-toggle">
    <button
      class="btn btn-bd-primary py-2 dropdown-toggle d-flex align-items-center"
      id="bd-theme"
      type="button"
      data-bs-toggle="dropdown"
      aria-expanded="false"
      aria-label="Toggle theme"
    >
      Theme
    </button>
    <ul class="dropdown-menu dropdown-menu-end shadow" aria-labelledby="bd-theme">
      <li><button type="button" class="dropdown-item" data-bs-theme-value="light">Light</button></li>
      <li><button type="button" class="dropdown-item" data-bs-theme-value="dark">Dark</button></li>
      <li><button type="button" class="dropdown-item active" data-bs-theme-value="auto">Auto</button></li>
    </ul>
  </div>

  <header data-bs-theme="dark">
    <div class="navbar navbar-dark bg-dark shadow-sm">
      <div class="container">
        <a href="#" class="navbar-brand">
          <strong>High Card Betting Game</strong>
        </a>
      </div>
    </div>
  </header>

  <main>
    <section class="py-5 text-center container">
      <div class="row py-lg-4">
        <div class="col-lg-7 col-md-9 mx-auto">
          <h1 class="fw-light">High Card</h1>
          <p class="lead text-body-secondary">
            Bet your chips and see if the second card is higher than the first card.
          </p>

          <h3 id="chips" class="mb-4">Chips: 200</h3>

          <div class="row justify-content-center">
            <div class="col-sm-6 col-md-5">
              <label for="betAmount" class="form-label">Enter your bet</label>
              <input
                type="number"
                class="form-control form-control-lg text-center"
                id="betAmount"
                min="1"
                placeholder="Bet amount"
              >
            </div>
          </div>

          <div class="mt-3">
          <button
             type="button"
              class="btn btn-primary btn-lg my-2"
              onclick="drawOneCard()"
              Draw First Card
              >
          </button>

            <button
              type="button"
              class="btn btn-success btn-lg my-2"
              onclick="makeBet()"
            >
              Place Bet & Draw Second Card
            </button>
          </div>

          <p id="betWon" class="text-success fw-bold mt-3"></p>
          <p id="betLost" class="text-danger fw-bold"></p>
        </div>
      </div>
    </section>

    <div class="album py-5 bg-body-tertiary">
      <div class="container">
        <div class="row row-cols-1 row-cols-md-2 g-4 justify-content-center">

          <!-- First card -->
          <div class="col">
            <div class="card shadow-sm h-100">
              <img id="image" class="card-img-top" alt="First card" hidden onload="this.hidden = false">
              <div class="card-body text-center">
                <h2 id="card">First Card</h2>
                <p class="card-text">Your first card.</p>
              </div>
            </div>
          </div>

          <!-- Second card -->
          <div class="col">
            <div class="card shadow-sm h-100">
              <img id="Secondimage" class="card-img-top" alt="Second card" hidden onload="this.hidden = false">
              <div class="card-body text-center">
                <h2 id="Secondcard">Second Card</h2>
                <p class="card-text">The card you are betting on.</p>
              </div>
            </div>
          </div>

        </div>
      </div>
    </div>
  </main>

  <footer class="text-body-secondary py-4">
    <div class="container text-center">
      <p class="mb-0">Good luck!</p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
